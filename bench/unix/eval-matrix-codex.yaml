# Run from the daocloud-skills repository root after rendering the task.
skillsDir: ./skills
tasksDir: ./bench/unix/.runtime/tasks
outputDir: ./bench/unix/.build/dce-skill-bench
clusterCreationPolicy: DoNotCreate

agents:
  - id: codex
    bin: ./bench/unix/.build/bin/k8s-ai-agent-bridge
    adapter: generic-stdin
    args: [--agent, codex]

models:
  - id: codex
    provider: openai
    model: gpt-5.3-codex

runs:
  iterations: 1
  concurrency: 1
  # taskPattern is a regex; narrow it (e.g. "pod-diagnosis") to run a subset.
  taskPattern: ".*"
  agent: codex
