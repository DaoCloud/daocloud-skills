  agentclaw:
    display_name: agentclaw
    # Vendored from agentclaw@v0.5.0 (gitlab.daocloud.cn/ndx/engineering/clawos/agentclaw,
    # api/openapiv2/**). Not published in daocloud-api-docs. protoc-gen-openapiv2 emits one
    # file per proto package; the definition-only files (page/types/permission/skill_types)
    # are omitted since every file inlines the definitions it needs.
    local_path: ..
    backend: swagger
    swagger:
      files:
        - specs/agentclaw/agent.swagger.json
        - specs/agentclaw/skill.swagger.json
        - specs/agentclaw/skill_publish.swagger.json
        - specs/agentclaw/workspace.swagger.json
        - specs/agentclaw/user.swagger.json
        - specs/agentclaw/model.swagger.json
        - specs/agentclaw/networkpolicy.swagger.json
        - specs/agentclaw/overview.swagger.json
        - specs/agentclaw/feature_gate.swagger.json
